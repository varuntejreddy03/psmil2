<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Central redirect map (update only these links)
    const redirects = {
      "varun": "https://youtu.be/sfgGjT9KV0w?si=gGXDQoYW6Fjdwk65",
      "sreeker": "https://youtu.be/XXXXXXXXXXX",
      "bharath": "https://youtu.be/XXXXXXXXXXX",
      "divija": "https://youtu.be/XXXXXXXXXXX",
      "prasanna": "https://youtu.be/XXXXXXXXXXX",
      "parley": "https://youtu.be/XXXXXXXXXXX"
    };

    const path = window.location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();

    window.onload = () => {
      if (redirects[path]) {
        document.body.innerHTML = `<h2 style="text-align:center;margin-top:20vh;font-family:Arial;">Redirecting ${path}'s milestone video...</h2>`;
        setTimeout(() => {
          window.location.href = redirects[path];
        }, 1000);
      } else {
        document.body.innerHTML = `
          <h2 style="text-align:center;margin-top:20vh;font-family:Arial;">
            🚀 Link not found!<br><br>
            Please check the name in the URL.
          </h2>`;
      }
    };
  </script>
</head>
<body>
  <p style="text-align:center;margin-top:20vh;font-family:Arial;">
    Preparing redirect...
  </p>
</body>
</html>
